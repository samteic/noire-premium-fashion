  <!-- Background with subtle luxury border -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Centered Serif N Monogram -->
  <text x="32" y="44" font-family="'Cinzel', 'Times New Roman', 'Baskerville', 'Didot', serif" font-size="38" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">N</text>
